<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - MHS Konnect</title>
  <link rel="stylesheet" href="css/social.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Auth Container -->
  <div class="auth-container">
    <div class="auth-box">
      <!-- Logo -->
      <div class="auth-logo">
        <h1>MHS <span class="con">KON</span><span class="nect">NECT</span></h1>
      </div>

      <!-- Sign Up Form -->
      <form id="signupForm" class="auth-form">
        <h2>🎮 Create Account</h2>

        <div class="form-group">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" placeholder="Choose a unique username" required minlength="3">
          <small class="form-hint">At least 3 characters</small>
        </div>

        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="Create a strong password" required minlength="6">
          <small class="form-hint">At least 6 characters</small>
        </div>

        <div class="form-group">
          <label for="signup-confirm-password">Confirm Password</label>
          <input type="password" id="signup-confirm-password" placeholder="Re-enter your password" required>
        </div>

        <div class="form-group">
          <label for="signup-dob">Date of Birth</label>
          <input type="date" id="signup-dob" placeholder="Select your date of birth" required>
          <small class="form-hint">Must be 13 or older</small>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="agree-terms" required>
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn-primary">🚀 Create Account</button>

        <div class="auth-divider">
          <span>OR</span>
        </div>

        <div class="auth-switch">
          <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
      </form>

      <!-- Error/Success Messages -->
      <div id="auth-message" class="auth-message"></div>
    </div>

    <!-- Background Animation -->
    <div class="auth-bg-animation">
      <div class="bg-circle"></div>
      <div class="bg-circle"></div>
      <div class="bg-circle"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
