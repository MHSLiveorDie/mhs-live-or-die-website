<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MHS Konnect</title>
  <link rel="stylesheet" href="css/social.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Auth Container -->
  <div class="auth-container">
    <div class="auth-box">
      <!-- Logo -->
      <div class="auth-logo">
        <h1>MHS <span class="con">KON</span><span class="nect">NECT</span></h1>
        <p class="tagline">Connect. Survive. Dominate.</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <h2>🔓 Login</h2>

        <div class="form-group">
          <label for="login-username">Username or Email</label>
          <input type="text" id="login-username" placeholder="Enter your username or email" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember-me">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">🚀 Login</button>

        <div class="auth-divider">
          <span>OR</span>
        </div>

        <div class="auth-switch">
          <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
        </div>
      </form>

      <!-- Error/Success Messages -->
      <div id="auth-message" class="auth-message"></div>
    </div>

    <!-- Background Animation -->
    <div class="auth-bg-animation">
      <div class="bg-circle"></div>
      <div class="bg-circle"></div>
      <div class="bg-circle"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
