<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titanfall 2 Montage #1 - MHS Live or Die</title>
    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=Orbitron:wght@400;700;900&family=Electrolize&display=swap" rel="stylesheet">
    <style>
        .video-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(135deg, rgba(10, 10, 10, 0.8) 0%, rgba(26, 5, 5, 0.75) 50%, rgba(5, 10, 15, 0.8) 100%),
                url('images/intro-background.jpg') center/cover no-repeat fixed;
            padding: 2rem;
            padding-top: 100px;
        }

        .video-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            width: 100%;
            max-width: 1400px;
        }

        .side-text {
            font-family: 'Electrolize', var(--font-heading);
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .survive-text {
            color: var(--battlefield-primary);
            text-shadow: 0 0 20px var(--battlefield-glow);
        }

        .perish-text {
            color: var(--horror-primary);
            text-shadow: 0 0 20px var(--horror-glow);
        }

        .video-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .video-wrapper {
            position: relative;
            width: 40vw;
            padding-bottom: 22.5vw; /* 16:9 aspect ratio */
            border-radius: 12px;
            border: 4px solid transparent;
            background:
                linear-gradient(var(--bg-dark), var(--bg-dark)) padding-box,
                linear-gradient(135deg, var(--horror-primary), var(--battlefield-primary), var(--horror-primary)) border-box;
            box-shadow:
                0 10px 50px rgba(255, 0, 0, 0.3),
                0 0 100px rgba(0, 255, 65, 0.2),
                0 0 30px rgba(255, 255, 255, 0.1);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        .video-tagline {
            font-size: 1.3rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-align: center;
        }

        .video-actions {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.8rem 2rem;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--horror-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--horror-secondary);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--horror-glow);
        }

        .btn-secondary {
            background: var(--battlefield-primary);
            color: black;
        }

        .btn-secondary:hover {
            background: #00cc34;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--battlefield-glow);
        }

        @media (max-width: 1024px) {
            .video-container {
                flex-direction: column;
            }

            .side-text {
                writing-mode: horizontal-tb;
                font-size: 2rem;
            }

            .video-wrapper {
                width: 80vw;
                padding-bottom: 45vw;
            }
        }

        @media (max-width: 768px) {
            .video-wrapper {
                width: 90vw;
                padding-bottom: 50.625vw;
            }

            .video-actions {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
